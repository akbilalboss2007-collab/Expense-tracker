<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple Expense Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#172033;font:16px Arial,sans-serif}.container{max-width:900px;margin:40px auto;padding:20px}h1{margin:0 0 8px}.sub{color:#64748b;margin:0 0 24px}.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:22px}.card,.panel{background:white;border-radius:14px;padding:20px;box-shadow:0 5px 20px #1720330a}.label{font-size:13px;color:#64748b;margin-bottom:8px}.amount{font-size:26px;font-weight:bold}.panel{margin-bottom:20px}h2{font-size:18px;margin:0 0 16px}form{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px}input,select,button{font:inherit;padding:12px;border:1px solid #dbe1eb;border-radius:9px;min-width:0}button{background:#2563eb;color:white;border:0;font-weight:bold;cursor:pointer}button:hover{background:#1d4ed8}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 8px;border-bottom:1px solid #edf0f5}th{font-size:12px;color:#64748b}.delete{background:#fee2e2;color:#b91c1c;padding:8px 10px}.empty{text-align:center;color:#64748b;padding:25px}.toolbar{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px}.toolbar input{flex:1}@media(max-width:650px){.container{margin:15px auto;padding:14px}.summary{grid-template-columns:1fr 1fr}form{grid-template-columns:1fr 1fr}form input:first-child,form button{grid-column:1/-1}.table-wrap{overflow-x:auto}table{min-width:520px}}
</style></head>
<body><main class="container">
<h1>Expense Tracker</h1><p class="sub">Track your daily spending in one simple place.</p>
<div class="summary"><div class="card"><div class="label">Total Expenses</div><div class="amount" id="total">Rs 0</div></div><div class="card"><div class="label">Total Records</div><div class="amount" id="count">0</div></div></div>
<section class="panel"><h2>Add New Expense</h2><form id="expenseForm">
<input id="title" placeholder="Expense name" maxlength="60" required>
<input id="amount" type="number" placeholder="Amount (Rs)" min="1" step="1" required>
<select id="category"><option>Food</option><option>Transport</option><option>Shopping</option><option>Bills</option><option>Education</option><option>Other</option></select>
<button>Add Expense</button></form></section>
<section class="panel"><div class="toolbar"><h2 style="margin:8px 0">Your Expenses</h2><input id="search" type="search" placeholder="Search expenses..."></div>
<div class="table-wrap"><table><thead><tr><th>NAME</th><th>CATEGORY</th><th>AMOUNT</th><th>DATE</th><th></th></tr></thead><tbody id="expenseList"></tbody></table><div class="empty" id="empty">No expenses yet. Add your first expense above.</div></div></section>
</main>
<script>
const form=document.getElementById('expenseForm'),list=document.getElementById('expenseList'),empty=document.getElementById('empty'),search=document.getElementById('search');
let expenses=[];try{expenses=JSON.parse(localStorage.getItem('simpleExpenses')||'[]')}catch(e){expenses=[]}
const money=n=>'Rs '+Number(n).toLocaleString('en-PK');
function render(){
 const q=search.value.trim().toLowerCase(),filtered=expenses.filter(x=>(x.title+' '+x.category).toLowerCase().includes(q));list.innerHTML='';
 filtered.forEach(item=>{const tr=document.createElement('tr');[item.title,item.category,money(item.amount),item.date].forEach(value=>{const td=document.createElement('td');td.textContent=value;tr.appendChild(td)});
 const td=document.createElement('td'),btn=document.createElement('button');btn.textContent='Delete';btn.className='delete';btn.onclick=()=>{expenses=expenses.filter(x=>x.id!==item.id);save();render()};td.appendChild(btn);tr.appendChild(td);list.appendChild(tr)});
 empty.style.display=filtered.length?'none':'block';document.getElementById('total').textContent=money(expenses.reduce((s,x)=>s+Number(x.amount),0));document.getElementById('count').textContent=expenses.length;
}
function save(){localStorage.setItem('simpleExpenses',JSON.stringify(expenses))}
form.onsubmit=e=>{e.preventDefault();const title=document.getElementById('title').value.trim(),amount=Number(document.getElementById('amount').value),category=document.getElementById('category').value;if(!title||!Number.isFinite(amount)||amount<=0)return;expenses.unshift({id:Date.now()+Math.random(),title,amount,category,date:new Date().toLocaleDateString()});save();form.reset();render()};
search.oninput=render;render();
</script></body></html>
